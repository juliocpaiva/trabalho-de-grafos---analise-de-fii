[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fii-network-analyzer"
version = "0.1.0"
description = "Protótipo SMAC03 para análise relacional de FIIs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<4", "networkx>=3.4,<4",
  "matplotlib>=3.9,<4", "yfinance>=0.2.65,<2",
  "scikit-learn>=1.5,<2", "requests>=2.32,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
fii-network = "fii_network:main"

[tool.setuptools]
py-modules = [
  "algo_louvain", "algo_mst", "carteiras_choques", "coletar", "comparacao_modelos", "dashboard", "experimentos",
  "fii_network", "fonte_yfinance", "grafo_base", "main", "visualizacao",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
